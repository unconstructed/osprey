[project]
name = "strategy-lab"
version = "0.1.0"
description = "Osprey Strategy Lab: build, simulate, validate and approve trading strategies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nautilus_trader[visualization]==2.0.0rc9",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "optuna",
    "mlflow",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "joblib",
    "pyyaml",
    "httpx",
    "tabulate",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "mutmut",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: statistical calibration tests (thousands of simulated strategies); skip with -m 'not slow'",
]
filterwarnings = ["error::RuntimeWarning:lab.*"]

[tool.coverage.run]
source = ["lab"]
branch = true
omit = ["lab/data/synthetic.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mutmut]
# Mutation testing for the statistics everything else is judged by: `uv run mutmut run` (TESTING.md section 6).
# From the starter, with tests_dir pointing at the validation test files osprey kept.
paths_to_mutate = ["lab/validation/"]
source_paths = ["lab"]
# Without only_mutate, mutmut 3.8 mutates all of lab/ (TESTING.md section 6); this keeps it to the area under test.
only_mutate = ["lab/validation/stats.py", "lab/validation/splits.py", "lab/validation/montecarlo.py"]
tests_dir = [
    "tests/test_stats_exact.py",
    "tests/test_stats_props.py",
    "tests/test_splits_exact.py",
    "tests/test_splits_props.py",
    "tests/test_montecarlo_exact.py",
    "tests/test_montecarlo_props.py",
]
pytest_add_cli_args = ["-m", "not slow", "-p", "no:cacheprovider", "-x", "-q"]
also_copy = ["tests", "config"]
